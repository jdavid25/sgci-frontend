<section class="form-panel">
  <form [formGroup]="form" (ngSubmit)="enviar()">
    <div class="form-header">
      <h2>{{ esEdicion ? 'Editar categoria' : 'Nueva categoria' }}</h2>
    </div>

    @if (mensajeError()) {
      <div class="alert alert-danger d-flex align-items-center gap-2" role="alert">
        <i class="bi bi-exclamation-triangle"></i>
        <span>{{ mensajeError() }}</span>
      </div>
    }

    <div class="row g-3">
      <div class="col-md-8">
        <label for="nombre" class="form-label">Nombre</label>
        <input id="nombre" type="text" class="form-control" formControlName="nombre" />
        @if (form.controls.nombre.touched && form.controls.nombre.invalid) {
          <div class="form-text text-danger">El nombre es obligatorio y debe tener maximo 100 caracteres.</div>
        }
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-outline-secondary" (click)="cancelar.emit()" [disabled]="guardando()">
        Cancelar
      </button>
      <button type="submit" class="btn btn-primary d-flex align-items-center gap-2" [disabled]="guardando()">
        @if (guardando()) {
          <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        } @else {
          <i class="bi bi-save"></i>
        }
        <span>Guardar</span>
      </button>
    </div>
  </form>
</section>
