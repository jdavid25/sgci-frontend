<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/dashboard">
      <span class="brand-icon">
        <i class="bi bi-mortarboard"></i>
      </span>
      <span>SGCI</span>
    </a>

    <nav class="nav flex-column gap-1">
      @for (item of menu; track item.route) {
        @if (mostrar(item)) {
          <a
            class="nav-link"
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <i class="bi" [ngClass]="item.icon"></i>
            <span>{{ item.label }}</span>
          </a>
        }
      }
    </nav>
  </aside>

  <section class="content-shell">
    <header class="topbar">
      <div>
        <div class="text-muted small">Usuario</div>
        <strong>{{ usuario?.nombre }}</strong>
      </div>

      <div class="d-flex align-items-center gap-3">
        <span class="badge text-bg-light border">{{ usuario?.rol }}</span>
        <button type="button" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-2" (click)="cerrarSesion()">
          <i class="bi bi-box-arrow-right"></i>
          <span>Cerrar sesion</span>
        </button>
      </div>
    </header>

    <main class="main-content">
      <router-outlet />
    </main>
  </section>
</div>
